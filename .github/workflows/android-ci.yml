name: Android CI

# Penelope's quality gate (see docs/DEVELOPMENT_QUALITY_GATES.md). Two jobs:
#   1. Security scan: committed secrets in files and git history (fast, no Android SDK).
#   2. Build, analysis and tests: debug build, Detekt, unit/integration/regression/accessibility
#      tests with coverage, Android Lint, optional release build, and the quality report.
# Any critical failure fails the run; the report says exactly which check failed.

on:
  # Feature branches are checked through their pull request; pushes to main and release tags run
  # directly. This avoids running the same checks twice for every PR push.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_build:
        description: "Also build the release APK"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or pull request cancels the older, now-outdated run.
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so the scan covers every commit

      # Prints file, line and kind only; never the matched value.
      - name: Scan for committed secrets (files and history)
        run: |
          python3 scripts/test_secret_scan.py
          python3 scripts/secret_scan.py --history

  quality:
    name: Build, analysis and tests
    needs: security
    if: ${{ !cancelled() }} # still build and test when the scan fails, so the report is complete
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # app/build.gradle.kts: sourceCompatibility/targetCompatibility/jvmTarget = 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # app/build.gradle.kts: compileSdk = 35, targetSdk = 35 (AGP 8.7.3 uses build-tools 34.0.0).
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "Android SDK ready: platforms;android-35, build-tools;34.0.0"

      # Caches the Gradle distribution and dependencies, and validates the Gradle wrapper.
      # Only main writes to the cache; other branches and pull requests read from it.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Robolectric (Compose UI tests on the JVM) downloads an Android runtime jar once; cache it.
      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # Firebase config is optional: without it the app builds with Gemini and crash reporting off.
      # The file is written from an encrypted repository secret, never printed, and deleted at the end.
      # Secrets are not available to pull requests from forks, so those build without Firebase.
      - name: Add Firebase config from repository secret (if set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            if python3 -c 'import json,sys; json.load(open("app/google-services.json"))' 2>/dev/null; then
              echo "Firebase config written from secret (contents not shown)."
            else
              rm -f app/google-services.json
              echo "::error::GOOGLE_SERVICES_JSON is not valid JSON. Paste the whole google-services.json file into the secret."
              exit 1
            fi
          else
            echo "GOOGLE_SERVICES_JSON secret not set: building without Firebase; Gemini answers disabled."
          fi

      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug

      # Kotlin static analysis (likely bugs, coroutine misuse); rules in config/detekt/detekt.yml.
      - name: Detekt
        id: detekt
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew detekt

      # Unit, integration (Robolectric UI, simulated adapters), regression and accessibility tests,
      # with line coverage. testDebugUnitTest covers Android modules; :enet-core:test the ENET library.
      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew testDebugUnitTest :enet-core:test :app:koverXmlReportDebug :enet-core:koverXmlReport

      # Lint errors (including accessibility, security and lifecycle checks) fail the job.
      - name: Android Lint
        id: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew lintDebug

      # Release builds: on release tags, published releases, or when asked in a manual run.
      # The APK is unsigned; Play uploads are signed separately.
      - name: Build release APK
        id: release
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_build) }}
        run: ./gradlew :app:assembleRelease

      - name: Quality report
        id: report
        if: ${{ !cancelled() }}
        env:
          STAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || github.workflow }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SECURITY: ${{ needs.security.result }}
        run: |
          python3 scripts/quality_report.py \
            --stage "$(printf '%s' "$STAGE" | head -n 1)" --branch "$BRANCH" --commit "$COMMIT" \
            --build "${{ steps.build.outcome }}" --detekt "${{ steps.detekt.outcome }}" \
            --tests "${{ steps.tests.outcome }}" --lint "${{ steps.lint.outcome }}" \
            --security "$SECURITY" --release "${{ steps.release.outcome }}" \
            --out build/quality/QUALITY_REPORT.md > /dev/null || true
          cat build/quality/QUALITY_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the security scan failed
        if: ${{ !cancelled() && needs.security.result != 'success' }}
        run: |
          echo "::error::Security scan failed: see the 'Security scan' job."
          exit 1

      - name: Name the APK artifact
        if: success()
        id: apk
        env:
          # On pull requests GITHUB_SHA is GitHub's temporary merge commit; use the branch commit instead.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=ai-car-companion-${version}-debug-${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK (unsigned)
        if: ${{ success() && steps.release.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ai-car-companion-release-unsigned-${{ steps.apk.outputs.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ENET tester APK (experimental)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: enet-tester-debug-${{ steps.apk.outputs.sha }}
          path: enet-tester/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      # The quality report plus the raw reports it was built from.
      - name: Upload quality report and test, lint, Detekt and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/quality/QUALITY_REPORT.md
            */build/reports/tests/
            */build/reports/lint-results-debug.*
            */build/reports/detekt/
            */build/reports/kover/
            */build/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build reports on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: build-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            */build/reports
          if-no-files-found: ignore

      - name: Remove Firebase config
        if: always()
        run: rm -f app/google-services.json
