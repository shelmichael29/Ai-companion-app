name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Add Firebase config from repository secret (if set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config written from secret (contents not shown)."
          else
            echo "GOOGLE_SERVICES_JSON secret not set: building without Firebase; Gemini answers disabled."
          fi
      - name: Build, unit test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Name the APK artifact
        if: success()
        id: apk
        env:
          # On pull requests GITHUB_SHA is GitHub's temporary merge commit; use the branch commit instead.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=ai-car-companion-${version}-debug-${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
