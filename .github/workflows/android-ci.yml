name: Android CI

# Builds the debug APK, runs all JVM unit tests and Android lint on every push and pull request.
# Any compile error, failing test or lint error fails the run.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or pull request cancels the older, now-outdated run.
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # app/build.gradle.kts: sourceCompatibility/targetCompatibility/jvmTarget = 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # app/build.gradle.kts: compileSdk = 35, targetSdk = 35 (AGP 8.7.3 uses build-tools 34.0.0).
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "Android SDK ready: platforms;android-35, build-tools;34.0.0"

      # Caches the Gradle distribution and dependencies, and validates the Gradle wrapper.
      # Only runs on main write to the cache; other branches and pull requests read from it.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Firebase config is optional: without it the app builds with Gemini answers disabled.
      # The file is written from an encrypted repository secret, never printed, and deleted at the end.
      # Secrets are not available to pull requests from forks, so those build without Firebase.
      - name: Add Firebase config from repository secret (if set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            if python3 -c 'import json,sys; json.load(open("app/google-services.json"))' 2>/dev/null; then
              echo "Firebase config written from secret (contents not shown)."
            else
              rm -f app/google-services.json
              echo "::error::GOOGLE_SERVICES_JSON is not valid JSON. Paste the whole google-services.json file into the secret."
              exit 1
            fi
          else
            echo "GOOGLE_SERVICES_JSON secret not set: building without Firebase; Gemini answers disabled."
          fi

      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug

      - name: Run unit tests
        id: tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew testDebugUnitTest

      # Runs even if tests failed, so both results are reported in one run. Lint errors fail the job.
      - name: Run Android lint
        id: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew lintDebug

      - name: Write results summary
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          icon = {"success": "✅", "failure": "❌", "skipped": "⏭️", "cancelled": "⏹️"}
          print("## Android CI results\n")
          print("| Check | Result |\n|---|---|")
          for name, key in (("Debug build", "BUILD"), ("Unit tests", "TESTS"), ("Android lint", "LINT")):
              outcome = os.environ.get(key) or "skipped"
              print(f"| {name} | {icon.get(outcome, '')} {outcome} |")
          total = failed = skipped = 0
          failures = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              suite = ET.parse(path).getroot()
              total += int(suite.get("tests", 0)); skipped += int(suite.get("skipped", 0))
              for case in suite.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
                      failures.append(f"{case.get('classname', '').split('.')[-1]} › {case.get('name')}")
          if total:
              print(f"\n**Unit tests:** {total - failed - skipped} passed, {failed} failed, {skipped} skipped (of {total}).")
          for f in failures[:30]:
              print(f"- ❌ {f}")
          lint = "app/build/reports/lint-results-debug.xml"
          if os.path.exists(lint):
              issues = list(ET.parse(lint).getroot().iter("issue"))
              errors = sum(1 for i in issues if i.get("severity") in ("Error", "Fatal"))
              print(f"\n**Lint:** {errors} errors, {len(issues) - errors} warnings.")
          PY

      - name: Name the APK artifact
        if: success()
        id: apk
        env:
          # On pull requests GITHUB_SHA is GitHub's temporary merge commit; use the branch commit instead.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=ai-car-companion-${version}-debug-${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build reports on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: build-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/reports
          if-no-files-found: ignore

      - name: Remove Firebase config
        if: always()
        run: rm -f app/google-services.json
