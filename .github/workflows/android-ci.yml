name: ENET Tester CI

# Experimental ENET branch only: compile, test and publish the ENET tester.
# Car Companion is deliberately NOT a Gradle module in this branch.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ENET tester, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Confirm Car Companion cannot be built in this workspace
        run: |
          ./gradlew projects --console=plain > gradle-projects.txt
          cat gradle-projects.txt
          grep -q "Project ':enet-tester'" gradle-projects.txt
          grep -q "Project ':enet-core'" gradle-projects.txt
          if grep -q "Project ':app'" gradle-projects.txt; then
            echo "::error::Car Companion must not be included in the ENET tester Gradle project."
            exit 1
          fi

      - name: Build ENET tester debug APK
        id: build
        run: ./gradlew :enet-tester:assembleDebug --console=plain

      - name: Run ENET core and tester unit tests
        id: tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew :enet-core:test :enet-tester:testDebugUnitTest --console=plain

      - name: Run ENET tester Android lint
        id: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew :enet-tester:lintDebug --console=plain

      - name: Summarize ENET results
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          print("## ENET tester CI (not Car Companion)\n")
          print("| Check | Result |\n|---|---|")
          for label, key in (("ENET tester build", "BUILD"), ("ENET unit tests", "TESTS"), ("ENET tester lint", "LINT")):
              print(f"| {label} | {os.environ.get(key, 'skipped')} |")
          total = failed = skipped = 0
          for path in glob.glob("enet-*/build/test-results/**/*.xml", recursive=True):
              suite = ET.parse(path).getroot()
              total += int(suite.get("tests", 0))
              skipped += int(suite.get("skipped", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          print(f"\n**ENET unit tests:** {total - failed - skipped} passed, {failed} failed, {skipped} skipped.")
          PY

      - name: Name ENET-only APK artifact
        if: success()
        id: apk
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' enet-tester/build.gradle.kts)
          echo "name=BMW-ENET-tester-${version}-debug-${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload ENET tester APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: enet-tester/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: enet-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            enet-*/build/reports/tests/
            enet-*/build/reports/lint-results-debug.*
            enet-*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
